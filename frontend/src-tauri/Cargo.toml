[package]
name = "pdf2zh-desktop"
version = "1.9.16"
description = "PDFMathTranslate desktop application"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.4.3"

[profile.release]
strip = true
lto = true
