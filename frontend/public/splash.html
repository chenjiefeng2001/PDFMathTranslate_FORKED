<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>PDFMathTranslate</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14161b;
        color: #e8eaed;
        font-family: ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
      }
      .box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .brand {
        font-size: 18px;
        font-weight: 700;
      }
      .sub {
        font-size: 12px;
        opacity: 0.6;
      }
      .spinner {
        width: 22px;
        height: 22px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #165dff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="brand">PDFMathTranslate</div>
      <div class="spinner"></div>
      <div class="sub">正在启动文档智能运行时…</div>
    </div>
  </body>
</html>
