[project]
name = "pdf2zh"
version = "1.9.12"
description = "Latex PDF Translator"
authors = [{ name = "Byaidu", email = "byaidux@gmail.com" }]
license = "AGPL-3.0"
readme = "README.md"
requires-python = ">=3.11,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    # for arm64 linux whells
    "pymupdf",
    "tqdm",
    "tenacity",
    "numpy",
    "ollama",
    "xinference-client",
    "deepl",
    "openai>=1.0.0",
    "azure-ai-translation-text<=1.0.1",
    # 5.36 has a bug, webui starts with a white screen
    # 5.19 has: "const" in bool schema TypeError – fixed in >=5.20
    # Upper bound <5.36 to avoid: stream.ts Method not implemented
    # and postMessage cross-origin issues present in later 5.x
    "gradio>=5.20,<5.36",
    "huggingface_hub",
    "onnx",
    "onnxruntime",
    "opencv-python-headless",
    "tencentcloud-sdk-python-tmt",
    "pdfminer-six==20250416",
    "gradio_pdf>=0.0.21",
    "pikepdf",
    "peewee>=3.17.8",
    "fontTools",
    "babeldoc>=0.6.4",
    "rich",
]

[project.optional-dependencies]
backend = [
    "flask",
    "celery",
    "redis"
]
argostranslate = [
    "argostranslate"
]
mcp = [
    "mcp>=1.6.0",
]
cuda = [
    "onnxruntime-gpu",
]
dml = [
    "onnxruntime-directml",
]
magicpdf = [
    # MinerU 2.x（Py3.10-3.12 优先）或 magic-pdf 1.3.12（Py3.13 兜底）。
    # 由 pdf2zh.engine_env 自动选择；二者装其一即可。
    # 注意：两个包在 PyPI 上互相依赖冲突，不要同时安装。
    "mineru>=2.0",
    "magic-pdf>=1.3.12,<2",
]

precise = []  # marker — run `pdf2zh-setup-precise` after install to provision the isolated venv

[dependency-groups]
dev = [
    "black",
    "flake8",
    "pre-commit",
    "pytest",
    "build",
    "bumpver>=2024.1130",
]

[project.urls]
Homepage = "https://github.com/Byaidu/PDFMathTranslate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
pdf2zh = "pdf2zh.pdf2zh:main"
pdf2zh-setup-precise = "pdf2zh.kernel.precise:setup_precise_cli"

[tool.flake8]
ignore = ["E203", "E261", "E501", "W503", "E741"]
max-line-length = 88



[bumpver]
current_version = "1.9.12"
version_pattern = "MAJOR.MINOR.PATCH[.PYTAGNUM]"

[bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"'
]
"pdf2zh/__init__.py" = [
    '__version__ = "{version}"'
]
