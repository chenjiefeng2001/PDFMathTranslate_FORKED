[project]
name = "pdf2zh"
version = "1.9.13"
description = "Latex PDF Translator"
authors = [{ name = "Byaidu", email = "byaidux@gmail.com" }]
license = "AGPL-3.0"
readme = "README.md"
requires-python = ">=3.11,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    # for arm64 linux whells
    "pymupdf",
    "tqdm",
    "tenacity",
    "numpy",
    "ollama",
    "xinference-client",
    "deepl",
    "openai>=1.0.0",
    "azure-ai-translation-text<=1.0.1",
    # 5.36 has a bug, webui starts with a white screen
    # 5.19 has: "const" in bool schema TypeError – fixed in >=5.20
    # Upper bound <5.36 to avoid: stream.ts Method not implemented
    # and postMessage cross-origin issues present in later 5.x
    "gradio>=5.20,<5.36",
    "huggingface_hub",
    "onnx",
    "onnxruntime",
    "opencv-python-headless",
    "tencentcloud-sdk-python-tmt",
    "pdfminer-six>=20250416,<20250507",
    "gradio_pdf>=0.0.21",
    "pikepdf",
    "peewee>=3.17.8",
    "fontTools",
    "babeldoc>=0.6.4",
    "rich",
]

[project.optional-dependencies]
backend = [
    "flask",
    "celery",
    "redis"
]
argostranslate = [
    "argostranslate"
]
mcp = [
    "mcp>=1.6.0",
]
# `pdf2zh --api`（pdf2zh.services.api）与 Tauri sidecar（deploy/pdf2zh_sidecar.py）所需；
# 核心 CLI/GUI 不依赖，故为可选 extra
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
cuda = [
    "onnxruntime-gpu",
]
dml = [
    "onnxruntime-directml",
]
magicpdf = [
    # MinerU 3.x（>=3.1.0 起 Apache 系许可；官方支持 Py3.10-3.13，pipeline
    # 本地后端）。由 pdf2zh.engine_env 自动选择后端。
    # magic-pdf 1.x 已停更（最后 1.3.12 @2025-05），不再进默认依赖分支；
    # 仅作 MinerU 不可用时的手动兜底：`uv pip install -U "magic-pdf[full]<2"`。
    #
    # six：MinerU 3.4.5 的 pipeline 后端运行时 import six 但未声明依赖
    # （上游打包遗漏，实测 Win+Py3.13 首跑即 ModuleNotFoundError）；这里
    # 显式补上，上游修复后可移除。
    "mineru>=3.1,<4",
    "six",
]

precise = []  # marker — run `pdf2zh-setup-precise` after install to provision the isolated venv

[dependency-groups]
dev = [
    "black",
    "flake8",
    "pre-commit",
    "pytest",
    "build",
    "bumpver>=2024.1130",
]

[project.urls]
Homepage = "https://github.com/Byaidu/PDFMathTranslate"

[tool.black]
# 内嵌第三方代码不参与格式化（vendor/MinerU、pdf2zh/kernel 内嵌 git 检出），
# 构建产物目录一并排除；CI 的 psf/black@stable 从仓库根运行 --check，
# 依赖此配置保持通过。
extend-exclude = '''
(
  ^/vendor/
| ^/pdf2zh/kernel/
| ^/deploy/_build_sidecar/
| ^/script/build/
| ^/frontend/
)
'''

[tool.pytest.ini_options]
# 只收集第一方测试目录。CI 从仓库根执行 ``pytest .``，若不加限制会把
# vendor/MinerU 与 pdf2zh/kernel 内嵌检出的第三方测试一并收集——它们依赖
# 未安装的重可选依赖（torch 等），在 collection 阶段即报错并中断全量。
#
# 注意：``testpaths`` 仅在命令行不传路径时生效，CI 的显式 ``.`` 会绕过它；
# 必须用 ``norecursedirs`` 直接阻断对内嵌目录的递归（该选项覆盖默认值，
# 故需一并保留常用的默认排除项）。
testpaths = ["tests"]
norecursedirs = [
    ".*", "*.egg", "_darcs", "build", "CVS", "dist", "node_modules", "venv",
    "vendor",
    "pdf2zh/kernel",
    "frontend",
    "deploy/_build_sidecar",
]

# 告警治理：豁免当前依赖树中已知的三类第三方告警（均非本项目代码触发），
# 保证测试输出零 warning；新出现的告警仍会正常显示、可被及时发现。
# 注：未启用 ``error`` 基线 —— 全量套件存在 6 处既有的 GC 期
# ResourceWarning（未关闭文件/sqlite 连接，PytestUnraisableExceptionWarning），
# 属独立的资源卫生问题，修复后可再升级为 error。
filterwarnings = [
    # websockets 14 弃用 legacy 模块（经 gradio 间接导入时触发）
    "ignore::DeprecationWarning:websockets\\.legacy",
    # gradio 5.x 在无运行中事件循环时调用 asyncio.get_event_loop()
    "ignore:There is no current event loop:DeprecationWarning",
    # numpy.matrix PendingDeprecation（第三方库内部使用，非本仓库代码）
    "ignore::PendingDeprecationWarning:numpy\\.matrixlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# 默认会把整个工作目录（build/、frontend/、模型缓存等）打进 sdist（实测 >2GB）；
# 显式限定只带包本体与测试，README/LICENSE/pyproject 由 hatchling 自动附带。
packages = ["pdf2zh", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["pdf2zh"]

[project.scripts]
pdf2zh = "pdf2zh.pdf2zh:main"
pdf2zh-setup-precise = "pdf2zh.kernel.precise:setup_precise_cli"
pdf2zh-setup-mineru = "pdf2zh.kernel.mineru_env:setup_mineru_cli"

[tool.uv]
# magic-pdf 1.x 的 PyMuPDF<1.25.0 pin 属历史遗留（1.3.12 在 pymupdf 1.28 下实测正常），
# 而 babeldoc>=0.6.4 依赖 pymupdf>=1.26.7，二者严格解析必冲突。
# 用依赖覆写强制 pymupdf 高版本，保证 `uv sync`（CI 解析全部 extras）可解析
# `pdf2zh[magicpdf]`；pip 安装若报 pymupdf 冲突，见 docs/ADVANCED.md。
override-dependencies = [
    "pymupdf>=1.26.7",
]


[tool.flake8]
ignore = ["E203", "E261", "E501", "W503", "E741"]
max-line-length = 88



[bumpver]
current_version = "1.9.13"
version_pattern = "MAJOR.MINOR.PATCH[.PYTAGNUM]"

[bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"'
]
"pdf2zh/__init__.py" = [
    '__version__ = "{version}"'
]
