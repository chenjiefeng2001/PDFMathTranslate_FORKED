name: windows exe Release Workflow

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version (e.g., v1.0.0)'
        required: true
        type: string
  # push:
    # debug purpose
env:
  WIN_EXE_PYTHON_VERSION: 3.12.9
jobs:
  build-win64-exe:
    runs-on: windows-latest
    steps:
      - name: checkout babeldoc metadata
        uses: actions/checkout@v6
        with:
          repository: funstory-ai/BabelDOC
          path: babeldoctemp1234567
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: babeldoc/assets/embedding_assets_metadata.py
      - name: Cached Assets
        id: cache-assets
        uses: actions/cache@v5
        with:
          path: ~/.cache/babeldoc
          key: test-1-babeldoc-assets-${{ hashFiles('babeldoctemp1234567/babeldoc/assets/embedding_assets_metadata.py') }}
      - name: 检出代码
        uses: actions/checkout@v6

      - name: Setup uv with Python ${{ env.WIN_EXE_PYTHON_VERSION }}
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          python-version: ${{ env.WIN_EXE_PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      # 统一走 script/build-win64.ps1（与 release.yml / python-publish.yml 同一份
      # 实现），确保 gradio 长路径 & startup-events 补丁一定被应用；内联副本会因
      # 漏打补丁而产出无法在 Windows 启动的构建。
      - name: Build Windows executable (canonical script/build-win64.ps1)
        shell: pwsh
        run: |
          ./script/build-win64.ps1 `
            -PythonVersion "${{ env.WIN_EXE_PYTHON_VERSION }}" `
            -CleanBabelDoc `
            -DownloadVCRedist `
            -GenerateOfflineAssets

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: win64-exe
          path: ./script/build
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true

  test-win64-exe:
    needs: 
      - build-win64-exe
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: win64-exe
          path: ./script/build

      - name: Test show version
        run: |
          ./script/build/pdf2zh.exe --version
       
      - name: Test - Translate a PDF file with plain text only
        run: |
          ./script/build/pdf2zh.exe ./tests/file/translate.cli.plain.text.pdf -o ./tests/file

      - name: Test - Translate a PDF file figure
        run: |
          ./script/build/pdf2zh.exe ./tests/file/translate.cli.text.with.figure.pdf -o ./tests/file

      - name: Delete offline assets and cache
        shell: pwsh
        run: |
          # 并行删除两类互不相交的目标（离线资源包 / babeldoc 缓存）：
          # 独立路径 => 无竞争；ThrottleLimit=2 有界并发 => 无资源争用；
          # ForEach-Object -Parallel 自动等待全部完成 => 确定性汇合、无泄漏。
          Write-Host "==== 并行删除离线资源包与缓存目录 ===="
          $buildDir = (Resolve-Path "./script/build").Path
          $cachePath = Join-Path $env:USERPROFILE "/.cache/babeldoc"
          $delTasks = @(
            @{ Name = "offline-assets" },
            @{ Name = "babeldoc-cache" }
          )
          $delResults = $delTasks | ForEach-Object -ThrottleLimit 2 -Parallel {
            $t = $_
            try {
              if ($t.Name -eq "offline-assets") {
                $found = Get-ChildItem -Path $using:buildDir -Filter "offline_assets_*.zip" -Recurse
                if ($found) {
                  foreach ($f in $found) {
                    Write-Host "找到离线资源包: $($f.FullName)"
                    Remove-Item -LiteralPath $f.FullName -Force
                  }
                  Write-Host "已删除离线资源包"
                } else {
                  Write-Host "未找到离线资源包"
                }
              } else {
                if (Test-Path -LiteralPath $using:cachePath) {
                  Remove-Item -LiteralPath $using:cachePath -Recurse -Force
                  Write-Host "已删除缓存目录: $($using:cachePath)"
                } else {
                  Write-Host "缓存目录不存在: $($using:cachePath)"
                }
              }
              [pscustomobject]@{ Name = $t.Name; Ok = $true; Error = "" }
            } catch {
              [pscustomobject]@{ Name = $t.Name; Ok = $false; Error = $_.Exception.Message }
            }
          }
          foreach ($r in $delResults) { Write-Host ("  [{0}] {1}" -f $(if ($r.Ok) { "ok" } else { "FAIL" }), $r.Name) }
          $delFailed = @($delResults | Where-Object { -not $_.Ok })
          if ($delFailed.Count -gt 0) {
            foreach ($f in $delFailed) { Write-Host "::error::删除失败 [$($f.Name)]: $($f.Error)" }
            exit 1
          }

      - name: Test - Translate without offline assets
        run: |
          ./script/build/pdf2zh.exe ./tests/file/translate.cli.plain.text.pdf -o ./tests/file
          
      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./tests/file/

  