name: windows exe Release Workflow

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version (e.g., v1.0.0)'
        required: true
        type: string
  # push:
    # debug purpose
env:
  WIN_EXE_PYTHON_VERSION: 3.12.9
jobs:
  build-win64-exe:
    runs-on: windows-latest
    steps:
      - name: checkout babeldoc metadata
        uses: actions/checkout@v6
        with:
          repository: funstory-ai/BabelDOC
          path: babeldoctemp1234567
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: babeldoc/assets/embedding_assets_metadata.py
      - name: Cached Assets
        id: cache-assets
        uses: actions/cache@v5
        with:
          path: ~/.cache/babeldoc
          key: test-1-babeldoc-assets-${{ hashFiles('babeldoctemp1234567/babeldoc/assets/embedding_assets_metadata.py') }}
      - name: 检出代码
        uses: actions/checkout@v6

      - name: Setup uv with Python ${{ env.WIN_EXE_PYTHON_VERSION }}
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          python-version: ${{ env.WIN_EXE_PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: 执行所有任务（创建目录、下载、解压、复制文件、安装依赖）
        shell: pwsh
        run: |
          Write-Host "==== 删除 babeldoctemp1234567 文件夹 ===="
          if (Test-Path "./babeldoctemp1234567") {
              Remove-Item -Path "./babeldoctemp1234567" -Recurse -Force
              Write-Host "babeldoctemp1234567 文件夹已成功删除"
          } else {
              Write-Host "babeldoctemp1234567 文件夹不存在，无需删除"
          }
          Write-Host "==== 创建必要的目录 ===="
          New-Item -Path "./build" -ItemType Directory -Force
          New-Item -Path "./build/runtime" -ItemType Directory -Force
          New-Item -Path "./dep_build" -ItemType Directory -Force

          Write-Host "==== 复制代码到 dep_build ===="
          Get-ChildItem -Path "./" -Exclude "dep_build", "build" | Copy-Item -Destination "./dep_build" -Recurse -Force

          Write-Host "==== 并行下载并解压 Python / PyStand（有界并发；各任务写独立文件、解压到独立目录 => 无竞争）===="
          $pythonUrl = "https://www.python.org/ftp/python/${{ env.WIN_EXE_PYTHON_VERSION }}/python-${{ env.WIN_EXE_PYTHON_VERSION }}-embed-amd64.zip"
          $dlTasks = @(
            @{ Name = "python"; Url = $pythonUrl; Zip = "./dep_build/python.zip"; Dest = "./build/runtime" },
            @{ Name = "pystand"; Url = "https://github.com/skywind3000/PyStand/releases/download/1.1.4/PyStand-v1.1.4-exe.zip"; Zip = "./dep_build/PyStand.zip"; Dest = "./dep_build/PyStand" }
          )
          $dlResults = $dlTasks | ForEach-Object -ThrottleLimit 2 -Parallel {
            $t = $_
            try {
              $ProgressPreference = "SilentlyContinue"
              Invoke-WebRequest -Uri $t.Url -OutFile $t.Zip -ErrorAction Stop
              if ((Get-Item -LiteralPath $t.Zip).Length -eq 0) { throw "downloaded zip is empty: $($t.Zip)" }
              Expand-Archive -Path $t.Zip -DestinationPath $t.Dest -Force -ErrorAction Stop
              [pscustomobject]@{ Name = $t.Name; Ok = $true; Error = "" }
            } catch {
              [pscustomobject]@{ Name = $t.Name; Ok = $false; Error = $_.Exception.Message }
            }
          }
          # 确定性汇合：全部任务结束后统一聚合错误并快速失败
          foreach ($r in $dlResults) { Write-Host ("  [{0}] {1}" -f $(if ($r.Ok) { "ok" } else { "FAIL" }), $r.Name) }
          $dlFailed = @($dlResults | Where-Object { -not $_.Ok })
          if ($dlFailed.Count -gt 0) {
            foreach ($f in $dlFailed) { Write-Host "::error::下载/解压失败 [$($f.Name)]: $($f.Error)" }
            exit 1
          }

          Write-Host "==== 复制 PyStand.exe 到 build 并重命名 ===="
          $pystandExe = "./dep_build/PyStand/PyStand-x64-CLI/PyStand.exe"
          $destExe = "./build/pdf2zh.exe"
          if (Test-Path $pystandExe) {
              Copy-Item -Path $pystandExe -Destination $destExe -Force
          } else {
              Write-Host "错误: PyStand.exe 未找到！"
              exit 1
          }
          Write-Host "==== 创建 Python venv 在 dep_build ===="
          uv venv ./dep_build/venv

          ./dep_build/venv/Scripts/activate

          Write-Host "==== 在 venv 环境中安装项目依赖 ===="
          uv pip install .

          Write-Host "==== 复制 venv/Lib/site-packages 到 build/ ===="
          Copy-Item -Path "./dep_build/venv/Lib/site-packages" -Destination "./build/site-packages" -Recurse -Force

          Write-Host "==== 复制 script/_pystand_static.int 到 build/ ===="
          $staticFile = "./script/_pystand_static.int"
          $destStatic = "./build/_pystand_static.int"
          if (Test-Path $staticFile) {
              Copy-Item -Path $staticFile -Destination $destStatic -Force
          } else {
              Write-Host "错误: script/_pystand_static.int 未找到！"
              exit 1
          }

          uv run --active babeldoc --generate-offline-assets ./build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: win64-exe
          path: ./build
          if-no-files-found: error
          compression-level: 9
          include-hidden-files: true

  test-win64-exe:
    needs: 
      - build-win64-exe
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: win64-exe
          path: ./build

      - name: Test show version
        run: |
          ./build/pdf2zh.exe --version
      
      - name: Test - Translate a PDF file with plain text only
        run: |
          ./build/pdf2zh.exe ./tests/file/translate.cli.plain.text.pdf -o ./tests/file

      - name: Test - Translate a PDF file figure
        run: |
          ./build/pdf2zh.exe ./tests/file/translate.cli.text.with.figure.pdf -o ./tests/file

      - name: Delete offline assets and cache
        shell: pwsh
        run: |
          # 并行删除两类互不相交的目标（离线资源包 / babeldoc 缓存）：
          # 独立路径 => 无竞争；ThrottleLimit=2 有界并发 => 无资源争用；
          # ForEach-Object -Parallel 自动等待全部完成 => 确定性汇合、无泄漏。
          Write-Host "==== 并行删除离线资源包与缓存目录 ===="
          $buildDir = (Resolve-Path "./build").Path
          $cachePath = Join-Path $env:USERPROFILE "/.cache/babeldoc"
          $delTasks = @(
            @{ Name = "offline-assets" },
            @{ Name = "babeldoc-cache" }
          )
          $delResults = $delTasks | ForEach-Object -ThrottleLimit 2 -Parallel {
            $t = $_
            try {
              if ($t.Name -eq "offline-assets") {
                $found = Get-ChildItem -Path $using:buildDir -Filter "offline_assets_*.zip" -Recurse
                if ($found) {
                  foreach ($f in $found) {
                    Write-Host "找到离线资源包: $($f.FullName)"
                    Remove-Item -LiteralPath $f.FullName -Force
                  }
                  Write-Host "已删除离线资源包"
                } else {
                  Write-Host "未找到离线资源包"
                }
              } else {
                if (Test-Path -LiteralPath $using:cachePath) {
                  Remove-Item -LiteralPath $using:cachePath -Recurse -Force
                  Write-Host "已删除缓存目录: $($using:cachePath)"
                } else {
                  Write-Host "缓存目录不存在: $($using:cachePath)"
                }
              }
              [pscustomobject]@{ Name = $t.Name; Ok = $true; Error = "" }
            } catch {
              [pscustomobject]@{ Name = $t.Name; Ok = $false; Error = $_.Exception.Message }
            }
          }
          foreach ($r in $delResults) { Write-Host ("  [{0}] {1}" -f $(if ($r.Ok) { "ok" } else { "FAIL" }), $r.Name) }
          $delFailed = @($delResults | Where-Object { -not $_.Ok })
          if ($delFailed.Count -gt 0) {
            foreach ($f in $delFailed) { Write-Host "::error::删除失败 [$($f.Name)]: $($f.Error)" }
            exit 1
          }

      - name: Test - Translate without offline assets
        run: |
          ./build/pdf2zh.exe ./tests/file/translate.cli.plain.text.pdf -o ./tests/file
          
      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./tests/file/

  