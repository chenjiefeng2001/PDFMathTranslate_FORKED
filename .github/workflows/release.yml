# =============================================================================
# Build & Publish Release
# -----------------------------------------------------------------------------
# 在 GitHub Actions 远端打包并发布 Release 版本（适配 fork / 任意仓库）。
#
# 触发方式：
#   1. workflow_dispatch（手动）：
#      - version      : 发布版本号，如 1.9.12 或 v1.9.12（留空则读取 pyproject.toml）
#      - publish_pypi : 是否同时发布 sdist/wheel 到 PyPI（需要 PYPI_API_TOKEN secret
#                       或已配置 Trusted Publishing）
#      - run_tests    : 发布前是否运行完整测试套件（复用 python-test.yml）
#      - prerelease   : 是否标记为预发布
#   2. push tags v*   : 推送 v1.x.x 形式的 tag 时自动构建并发布。
#
# 产物（全部上传到对应 tag 的 GitHub Release）：
#   - PDFMathTranslate_<tag>_x64-setup.exe （Tauri v2 桌面安装包，推荐；
#     内置 REST/SSE API sidecar 与 SPA 前端）
#   - pdf2zh-<tag>-with-assets-win64.zip  （CLI 绿色版，内置字体/模型等离线资源）
#   - pdf2zh-<tag>-win64.zip              （CLI 绿色版，运行时按需下载资源）
#   - pdf2zh-<version>.whl / .tar.gz      （Python sdist + wheel）
#
# 所需权限：工作流需开启 Actions 的读写权限
#   （Settings > Actions > General > Workflow permissions: Read and write permissions）
# =============================================================================

name: Build & Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.9.12 or v1.9.12); empty = read from pyproject.toml'
        required: false
        default: ''
        type: string
      publish_pypi:
        description: 'Publish sdist/wheel to PyPI as well'
        required: false
        default: false
        type: boolean
      run_tests:
        description: 'Run the full test suite before building'
        required: false
        default: true
        type: boolean
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  WIN_EXE_PYTHON_VERSION: "3.12.9"

jobs:
  # ---------------------------------------------------------------------------
  # 解析并校验本次发布版本号
  # ---------------------------------------------------------------------------
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve release version
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          # strip an optional leading "v"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([._-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version '$VERSION' (expected e.g. 1.9.12)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $VERSION (git tag v$VERSION)"

  # ---------------------------------------------------------------------------
  # 可选：发布前运行完整测试套件（复用 python-test.yml）
  # ---------------------------------------------------------------------------
  test:
    name: Run test suite
    needs: version
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_tests)
    uses: ./.github/workflows/python-test.yml

  # ---------------------------------------------------------------------------
  # 构建 Python sdist + wheel
  # ---------------------------------------------------------------------------
  build-python:
    name: Build sdist & wheel
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv with Python 3.12
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Build distributions
        run: |
          uv build --wheel --sdist

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 构建 Windows x64 可执行版（复用 script/build-win64.ps1）
  # 产物在 script/build/ 下，打包成 with-assets / without-assets 两个 zip
  # ---------------------------------------------------------------------------
  build-win64:
    name: Build Windows x64 exe
    needs: version
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout babeldoc metadata (for asset cache key)
        uses: actions/checkout@v6
        with:
          repository: funstory-ai/BabelDOC
          path: babeldoctemp1234567
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: babeldoc/assets/embedding_assets_metadata.py

      - name: Cached babeldoc assets
        id: cache-assets
        uses: actions/cache@v5
        with:
          path: ~/.cache/babeldoc
          key: release-babeldoc-assets-${{ hashFiles('babeldoctemp1234567/babeldoc/assets/embedding_assets_metadata.py') }}

      - uses: actions/checkout@v6

      - name: Build Windows executable
        shell: pwsh
        run: |
          ./script/build-win64.ps1 `
            -PythonVersion "${{ env.WIN_EXE_PYTHON_VERSION }}" `
            -CleanBabelDoc `
            -DownloadVCRedist `
            -GenerateOfflineAssets

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "./script/build/pdf2zh.exe")) {
            throw "pdf2zh.exe not found under ./script/build"
          }
          ./script/build/pdf2zh.exe --version

      - name: Package release zips
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildDir = "$env:GITHUB_WORKSPACE/script/build"
          $tag = "${{ needs.version.outputs.tag }}"
          $artifactsDir = "$env:GITHUB_WORKSPACE/artifacts"
          New-Item -ItemType Directory -Force -Path $artifactsDir | Out-Null

          # ------------------------------------------------------------------
          # 并行化说明：两个 zip 的 staging 目录互不相交（共享源 buildDir 只读，
          # 各自写私有 staging），压缩输出也是两个不同文件 => 无写写竞争；
          # ThrottleLimit=2 有界并发 => 无资源争用与饥饿；
          # ForEach-Object -Parallel 阻塞直至全部完成 => 确定性汇合、无泄漏。
          # ------------------------------------------------------------------

          # 并行阶段 1：staging 复制
          $stages = @(
            @{ Name = "with-assets"; Dir = "$env:GITHUB_WORKSPACE/stage_with_assets" },
            @{ Name = "no-assets"; Dir = "$env:GITHUB_WORKSPACE/stage_no_assets" }
          )
          $stageResults = $stages | ForEach-Object -ThrottleLimit 2 -Parallel {
            $s = $_
            try {
              New-Item -ItemType Directory -Force -Path (Join-Path $s.Dir "pdf2zh") | Out-Null
              Copy-Item -Path (Join-Path $using:buildDir "*") -Destination (Join-Path $s.Dir "pdf2zh") -Recurse -Force
              [pscustomobject]@{ Name = $s.Name; Ok = $true; Error = "" }
            } catch {
              [pscustomobject]@{ Name = $s.Name; Ok = $false; Error = $_.Exception.Message }
            }
          }
          foreach ($r in $stageResults) {
            if (-not $r.Ok) { Write-Host "::error::staging 失败 [$($r.Name)]: $($r.Error)" }
          }
          if (@($stageResults | Where-Object { -not $_.Ok }).Count -gt 0) { exit 1 }

          # 串行步骤：仅从 no-assets staging 剔除离线资源包（必须在压缩前）
          Get-ChildItem -Path "$env:GITHUB_WORKSPACE/stage_no_assets" -Filter "offline_assets_*.zip" -Recurse | Remove-Item -Force

          # 并行阶段 2：压缩（CPU 密集，双核并行收益最大）
          $zips = @(
            @{ Name = "with-assets"; Source = "$env:GITHUB_WORKSPACE/stage_with_assets/pdf2zh"; Dest = Join-Path $artifactsDir "pdf2zh-$tag-with-assets-win64.zip" },
            @{ Name = "no-assets"; Source = "$env:GITHUB_WORKSPACE/stage_no_assets/pdf2zh"; Dest = Join-Path $artifactsDir "pdf2zh-$tag-win64.zip" }
          )
          $zipResults = $zips | ForEach-Object -ThrottleLimit 2 -Parallel {
            $z = $_
            try {
              Compress-Archive -Path $z.Source -DestinationPath $z.Dest -CompressionLevel Optimal
              [pscustomobject]@{ Name = $z.Name; Ok = $true; Error = "" }
            } catch {
              [pscustomobject]@{ Name = $z.Name; Ok = $false; Error = $_.Exception.Message }
            }
          }
          foreach ($r in $zipResults) {
            if (-not $r.Ok) { Write-Host "::error::压缩失败 [$($r.Name)]: $($r.Error)" }
          }
          if (@($zipResults | Where-Object { -not $_.Ok }).Count -gt 0) { exit 1 }

          Write-Host "==== Release packages ===="
          Get-ChildItem $artifactsDir | Select-Object Name, Length

      - name: Upload win64 build (unpacked, for smoke test)
        uses: actions/upload-artifact@v7
        with:
          name: win64-build
          path: script/build
          if-no-files-found: error
          compression-level: 1

      - name: Upload release zips
        uses: actions/upload-artifact@v7
        with:
          name: win64-release-zips
          path: artifacts
          if-no-files-found: error
          compression-level: 0

  # ---------------------------------------------------------------------------
  # 构建 Tauri v2 桌面包（推荐分发形态），三段链路与本地
  # script/build-tauri.ps1 一一对应：
  #   [1/3] REST/SSE API sidecar：PyInstaller onedir（deploy/pdf2zh-api-sidecar.spec）
  #   [2/3] SPA 静态产物：npm ci + npm run build → frontend/dist
  #   [3/3] npx tauri build → NSIS 安装器
  # ---------------------------------------------------------------------------
  build-tauri-win64:
    name: Build Windows Tauri desktop
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 22 (SPA build)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Setup uv with Python ${{ env.WIN_EXE_PYTHON_VERSION }}
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          python-version: ${{ env.WIN_EXE_PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      # 统一走 script/build-tauri.ps1（与本地桌面构建同一份实现），三段链路一致：
      #   [1/3] sidecar (PyInstaller onedir) / [2/3] SPA / [3/3] tauri NSIS。
      - name: Sync deps + pyinstaller (uv)
        shell: pwsh
        run: |
          uv sync --python "${{ env.WIN_EXE_PYTHON_VERSION }}"
          uv pip install pyinstaller

      - name: Build desktop (script/build-tauri.ps1)
        shell: pwsh
        run: |
          ./script/build-tauri.ps1 -UseUv `
            -TauriVersion "${{ needs.version.outputs.version }}"

      - name: Verify bundle artifacts
        shell: pwsh
        run: |
          $nsis = "frontend/src-tauri/target/release/bundle/nsis"
          if (-not (Test-Path $nsis)) { throw "NSIS bundle dir not found: $nsis" }
          $installers = Get-ChildItem $nsis -Filter "*-setup.exe"
          if (-not $installers) { throw "no NSIS installer produced" }
          $installers | ForEach-Object { Write-Host "Installer: $($_.FullName) ($([math]::Round($_.Length/1MB,1)) MB)" }

      - name: Smoke-test bundled sidecar (health endpoint)
        shell: pwsh
        run: |
          $exe = "frontend/src-tauri/binaries/pdf2zh-api-sidecar/pdf2zh-api-sidecar.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--port", "11099" -PassThru
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited) { break }
              try {
                $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 `
                  -Uri "http://127.0.0.1:11099/api/health"
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "bundled sidecar health check failed" }
            Write-Host "Sidecar health check OK"
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Upload Tauri installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: tauri-win64-installer
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 0

  # ---------------------------------------------------------------------------
  # Windows exe 冒烟测试（版本输出 + 真实翻译两个测试 PDF）
  # ---------------------------------------------------------------------------
  smoke-test-win64:
    name: Smoke-test Windows exe
    needs: build-win64
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Download win64 build
        uses: actions/download-artifact@v8
        with:
          name: win64-build
          path: ./build

      - name: Test show version
        run: |
          ./build/pdf2zh.exe --version

      - name: Test - translate a plain text PDF
        run: |
          ./build/pdf2zh.exe ./tests/file/translate.cli.plain.text.pdf -o ./tests/file

      - name: Test - translate a PDF with figure
        run: |
          ./build/pdf2zh.exe ./tests/file/translate.cli.text.with.figure.pdf -o ./tests/file

      - name: Upload smoke test results
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-results
          path: ./tests/file/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 创建 / 更新 GitHub Release 并上传全部资产
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: [version, build-python, build-win64, smoke-test-win64, build-tauri-win64]
    if: >-
      needs.build-python.result == 'success' &&
      needs.build-win64.result == 'success' &&
      needs.smoke-test-win64.result == 'success' &&
      needs.build-tauri-win64.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download python dist
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: ./dist

      - name: Download win64 release zips
        uses: actions/download-artifact@v8
        with:
          name: win64-release-zips
          path: ./assets

      - name: Download Tauri installer
        uses: actions/download-artifact@v8
        with:
          name: tauri-win64-installer
          path: ./assets

      - name: Create / update GitHub release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${{ needs.version.outputs.version }}"

          PRERELEASE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          mapfile -t ASSETS < <(find ./dist ./assets -type f | sort)

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists -> uploading assets (--clobber)."
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            echo "Creating release $TAG"
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "pdf2zh $VERSION" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              $PRERELEASE_FLAG
          fi

          echo "==== Release assets ===="
          gh release view "$TAG" --json tagName,assets --jq '.tagName, (.assets[].name)'

  # ---------------------------------------------------------------------------
  # 可选：发布 Python 包到 PyPI
  #   需要 PYPI_API_TOKEN secret，或已为仓库配置 Trusted Publishing。
  # ---------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI (optional)
    needs: [version, build-python]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - name: Download python dist
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - name: Check PyPI credential
        run: |
          if [ -z "${{ secrets.PYPI_API_TOKEN }}" ]; then
            echo "::warning::PYPI_API_TOKEN is not set - falling back to Trusted Publishing (requires a 'pypi' trusted publisher for this repository)."
          fi

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
