name: fork-build

on:
  workflow_dispatch:
  # debug purpose
  # push:

env:
  REGISTRY: ghcr.io
  REPO_LOWER: ${{ github.repository_owner }}/${{ github.event.repository.name }}
  GHCR_REPO: ghcr.io/${{ github.repository }}
  WIN_EXE_PYTHON_VERSION: 3.12.9
jobs:
  check-repository:
    name: Check if running in main repository
    runs-on: ubuntu-latest
    outputs:
      is_main_repo: ${{ github.repository == 'Byaidu/PDFMathTranslate' }}
    steps:
      - run: echo "Running repository check"

  test:
    uses: ./.github/workflows/python-test.yml
    needs: check-repository
    if: needs.check-repository.outputs.is_main_repo != 'true'

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    needs: 
      - check-repository
      - test
    if: needs.check-repository.outputs.is_main_repo != 'true'
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Convert to lowercase
        run: |
          echo "GHCR_REPO_LOWER=$(echo ${{ env.GHCR_REPO }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_REPO_LOWER }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.GHCR_REPO_LOWER }},push-by-digest=true,name-canonical=true,push=true
          cache-from: ${{ matrix.platform == 'linux/amd64' && 'type=gha' || '' }}
          cache-to: ${{ matrix.platform == 'linux/amd64' && 'type=gha,mode=max' || '' }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - check-repository
      - test
      - build
    if: needs.check-repository.outputs.is_main_repo != 'true'
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Convert to lowercase
        run: |
          echo "GHCR_REPO_LOWER=$(echo ${{ env.GHCR_REPO }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_REPO_LOWER }}
          tags: |
            type=raw,value=dev
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.GHCR_REPO_LOWER }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.GHCR_REPO_LOWER }}:${{ steps.meta.outputs.version }}
  
  build-win64-exe:
    runs-on: windows-latest
    needs:
      - check-repository
    if: needs.check-repository.outputs.is_main_repo != 'true'
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      # 不开 uv 缓存：本作业全程不碰 uv —— build-win64.ps1 自己下载嵌入式
      # Python 并用内嵌 pip 装依赖，uv 的缓存目录从头到尾是空的。开着反而在
      # 收尾时炸：post 步骤先 `uv cache prune --ci --force` 把空目录删掉，
      # 紧接着保存缓存就报 "Cache path ... does not exist on disk"，
      # 明明 exe 已经构建成功，作业却被判红。
      #
      # 注意必须显式写 false：setup-uv 该版本的 enable-cache 默认是 "auto"，
      # 而 auto 见到仓库里的 uv.lock 就会把缓存打开，所以光删掉
      # `enable-cache: true` 那两行是没用的。
      - name: Setup uv with Python ${{ env.WIN_EXE_PYTHON_VERSION }}
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          python-version: ${{ env.WIN_EXE_PYTHON_VERSION }}
          enable-cache: false

      # 统一走 script/build-win64.ps1（与 release.yml / python-publish.yml / exe-build.yml
      # 同一份实现），确保 gradio 长路径 & startup-events 补丁一定被应用；内联副本
      # 会因漏打补丁而产出无法在 Windows 启动的构建。-GenerateOfflineAssets 已在构建
      # 期产出离线资源包，故本作业直接上传带资源的成品。
      - name: Build Windows executable (canonical script/build-win64.ps1)
        shell: pwsh
        run: |
          ./script/build-win64.ps1 `
            -PythonVersion "${{ env.WIN_EXE_PYTHON_VERSION }}" `
            -CleanBabelDoc `
            -DownloadVCRedist `
            -GenerateOfflineAssets

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: win64-exe-with-assets
          path: ./script/build
          if-no-files-found: error
          compression-level: 1
          include-hidden-files: true

  test-win64-exe:
    needs: 
      - build-win64-exe
      - check-repository
    if: needs.check-repository.outputs.is_main_repo != 'true'
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: Download build artifact (with offline assets)
        uses: actions/download-artifact@v8
        with:
          name: win64-exe-with-assets
          path: ./script/build

      - name: Test show version (online mode)
        run: |
          ./script/build/pdf2zh.exe --version

      # 同 python-test.yml：默认 google 服务在 CI 出口 IP 上会被限流到 429，
      # 那说明的是第三方网络而不是 exe 有没有构建对。交给 translate_smoke.sh
      # 判定：只对「后端不可达」放行，其余真实失败照常红。PDF2ZH_SMOKE_CMD 把
      # 被测入口从 `uv run pdf2zh` 换成刚构建出来的 exe。
      #
      # 必须显式 shell: bash —— 本作业跑在 windows-latest，默认 shell 是 pwsh，
      # 不认 `VAR=值 命令` 这种 POSIX 前缀写法。
      - name: Test - Translate a PDF file with plain text only (online mode)
        shell: bash
        run: |
          PDF2ZH_SMOKE_CMD="./script/build/pdf2zh.exe" bash script/ci/translate_smoke.sh ./tests/file/translate.cli.plain.text.pdf -o ./tests/file

      - name: Test - Translate a PDF file figure
        shell: bash
        run: |
          PDF2ZH_SMOKE_CMD="./script/build/pdf2zh.exe" bash script/ci/translate_smoke.sh ./tests/file/translate.cli.text.with.figure.pdf -o ./tests/file

      - name: Test - Translate without offline assets (online mode)
        shell: bash
        run: |
          PDF2ZH_SMOKE_CMD="./script/build/pdf2zh.exe" bash script/ci/translate_smoke.sh ./tests/file/translate.cli.plain.text.pdf -o ./tests/file

      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./tests/file/
          if-no-files-found: error

      - name: Delete cache
        shell: pwsh
        run: |
          Write-Host "==== 删除缓存目录 ===="
          $cachePath = "$env:USERPROFILE/.cache/babeldoc"
          if (Test-Path $cachePath) {
            Remove-Item -Path $cachePath -Recurse -Force
            Write-Host "已删除缓存目录: $cachePath"
          } else {
            Write-Host "缓存目录不存在: $cachePath"
          }

      - name: Test - Translate with offline assets (offline mode)
        shell: bash
        run: |
          echo "==== 测试离线资源 ===="
          mkdir -p ./tests/file/offline_result
          PDF2ZH_SMOKE_CMD="./script/build/pdf2zh.exe" bash script/ci/translate_smoke.sh ./tests/file/translate.cli.plain.text.pdf -o ./tests/file/offline_result

      # 产物上传是「留证据」，不是断言。offline_result 为空只说明这次翻译没产出
      # 译文 —— 在 CI 出口 IP 被 Google 限流时这是常态。真正的判红在前一步：
      # translate_smoke.sh 遇到非后端原因的真实失败会 ::error 并退出非零，
      # 所以这里用 warn 不会放过任何真实回归。
      - name: Upload offline test results
        uses: actions/upload-artifact@v7
        with:
          name: offline-test-results
          path: ./tests/file/offline_result/
          if-no-files-found: warn

      - name: Upload build with offline assets artifact
        uses: actions/upload-artifact@v7
        with:
          name: win64-exe-with-assets
          path: ./script/build
          if-no-files-found: error
          compression-level: 1
          include-hidden-files: true